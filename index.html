<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06142c" />
  <title>Tenerife Getaway with My Love</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --text: #ffffff;
      --muted: #f8d2dc;
      --gold: #ffe5b5;
      --panel-a: rgba(6, 14, 35, 0.62);
      --panel-b: rgba(11, 24, 56, 0.50);
      --hairline: rgba(255, 255, 255, 0.16);
      --sans: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 2vw, 18px);
      background: radial-gradient(circle at top, #143566 0%, #07142c 45%, #04101f 100%);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--sans);
    }

    /* ---------- Layout shell ---------- */

    .wrap {
      position: relative;
      container-type: inline-size;
      width: min(1535px, 100%);
      display: flex;
      flex-direction: column;
      gap: clamp(12px, 1.6vw, 16px);
    }

    /* Holds only the artwork, so its overflow clipping can never eat the countdown. */
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1535 / 1024;
      border-radius: clamp(16px, 2.2vw, 34px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .hero {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ---------- Countdown: mobile first, sits under the artwork ---------- */

    .countdown {
      background: linear-gradient(135deg, var(--panel-a), var(--panel-b));
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      border: 1px solid var(--hairline);
      border-radius: 18px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.32);
      padding: 14px 12px 15px;
      text-align: center;
    }

    .countdown__head {
      margin: 0 0 12px;
      font-size: 0.86rem;
      line-height: 1.35;
      font-weight: 700;
      color: var(--muted);
    }

    .units {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .unit {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 14px;
      padding: 12px 4px 10px;
    }

    .value {
      display: block;
      font-size: clamp(1.9rem, 9vw, 2.4rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 7px;
      font-size: 0.66rem;
      line-height: 1;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.82);
    }

    .caption {
      margin: 0;
      padding: 0 6px;
      text-align: center;
      font-size: clamp(0.9rem, 2.6vw, 1rem);
      line-height: 1.4;
      font-weight: 600;
      color: var(--gold);
      text-wrap: balance;
    }

    /* Arrived state */
    .countdown.is-here .units { display: none; }
    .countdown.is-here .countdown__head {
      margin: 0;
      color: var(--gold);
      font-size: 1.05rem;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* ---------- Wide screens: float the countdown into the open sky ---------- */

    @media (min-width: 900px) {
      @supports (top: 1cqw) {
        .countdown {
          position: absolute;
          left: 57cqw;
          top: 14.5cqw;
          width: 20.2cqw;
          margin: 0;
          border-radius: 14px;
          padding: 0.52cqw 0.70cqw 0.57cqw;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.30);
        }
        .countdown__head {
          margin: 0 0 0.50cqw;
          font-size: 0.80cqw;
          line-height: 1.3;
          white-space: nowrap;
        }
        .units { gap: 0.39cqw; }
        .unit { border-radius: 9px; padding: 0.45cqw 0.20cqw 0.40cqw; }
        .value { font-size: 1.75cqw; }
        .label { margin-top: 0.25cqw; font-size: 0.58cqw; letter-spacing: 0.10em; }
        .countdown.is-here .countdown__head { font-size: 1cqw; }
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="stage">
      <img class="hero" src="hero-art3.png" width="1535" height="1024" fetchpriority="high"
           alt="Illustration of Steve and Grace toasting with champagne at sunset in Tenerife, with a Jet2 flight map from Bristol and a photo of the ViVa Mora villa." />
    </div>

    <section class="countdown" id="countdown" role="timer" aria-live="off">
      <p class="countdown__head" id="head">Counting down&hellip;</p>
      <div class="units">
        <div class="unit"><span class="value" id="days">&ndash;</span><span class="label">Days</span></div>
        <div class="unit"><span class="value" id="hours">&ndash;</span><span class="label">Hours</span></div>
        <div class="unit"><span class="value" id="minutes">&ndash;</span><span class="label">Minutes</span></div>
      </div>
    </section>

    <p class="caption">Champagne and cuddles in the hot tub under the stars &#10024;</p>
    <p class="sr-only" id="announce" aria-live="polite"></p>
  </main>

  <script>
    // Single source of truth. +01:00 = UK summer time on 18 Sep 2026,
    // so the countdown is correct wherever it's opened from.
    const TRIP = new Date('2026-09-18T14:00:00+01:00');

    const el = {
      panel: document.getElementById('countdown'),
      head: document.getElementById('head'),
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      announce: document.getElementById('announce')
    };

    const tripLabel = new Intl.DateTimeFormat('en-GB', {
      day: 'numeric', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false,
      timeZone: 'Europe/London'
    }).format(TRIP);

    let lastAnnounced = '';

    function tick() {
      const diff = TRIP - new Date();

      if (diff <= 0) {
        el.panel.classList.add('is-here');
        el.head.textContent = 'Wheels up \u2014 enjoy every minute \u2708\uFE0F';
        return;
      }

      const totalMinutes = Math.floor(diff / 60000);
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;

      el.head.textContent = 'Countdown \u00B7 ' + tripLabel;
      el.days.textContent = days;
      el.hours.textContent = String(hours).padStart(2, '0');
      el.minutes.textContent = String(minutes).padStart(2, '0');

      const summary = days + ' days, ' + hours + ' hours and ' + minutes + ' minutes until Tenerife.';
      if (summary !== lastAnnounced) {
        lastAnnounced = summary;
        el.announce.textContent = summary;
      }
    }

    tick();
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
  </script>
</body>
</html>
