<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekend Getaway with My Love</title>
  <style>
    :root {
      --bg: #06142c;
      --panel: rgba(7, 17, 39, 0.72);
      --panel-border: rgba(255,255,255,0.12);
      --text: #ffffff;
      --muted: #f3c6d2;
      --shadow: 0 25px 80px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, #143566 0%, #07142c 45%, #04101f 100%);
      color: var(--text);
      font-family: Inter, Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .wrap {
      width: min(1500px, 100%);
      position: relative;
    }

    .hero {
      width: 100%;
      display: block;
      border-radius: 34px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .countdown-panel {
      position: absolute;
      left: 50%;
      bottom: 2.3%;
      transform: translateX(-50%);
      width: min(500px, calc(100% - 48px));
      background: linear-gradient(135deg, rgba(6,14,35,0.82), rgba(11,24,56,0.72));
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      padding: 16px 18px 14px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 4px;
      font-size: clamp(0.88rem, 1.2vw, 1.05rem);
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .trip-time {
      margin: 0 0 12px;
      font-size: clamp(0.82rem, 1.1vw, 0.98rem);
      opacity: 0.92;
    }

    .units {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .unit {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 12px 8px 10px;
    }

    .value {
      display: block;
      font-size: clamp(2rem, 5vw, 3.3rem);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .label {
      margin-top: 6px;
      display: block;
      font-size: clamp(0.72rem, 1vw, 0.9rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.82);
      font-weight: 700;
    }

    .footer-note {
      margin-top: 10px;
      font-size: clamp(0.78rem, 0.95vw, 0.92rem);
      color: #ffe5b5;
      font-weight: 600;
    }

    @media (max-width: 900px) {
      body { padding: 10px; }
      .hero { border-radius: 20px; }
      .countdown-panel {
        width: calc(100% - 20px);
        bottom: 1.2%;
        border-radius: 18px;
        padding: 12px;
      }
      .units { gap: 8px; }
      .unit { border-radius: 14px; padding: 10px 6px 8px; }
    }

    @media (max-width: 560px) {
      .wrap { width: 100%; }
      .countdown-panel {
        position: static;
        transform: none;
        width: 100%;
        margin-top: 14px;
      }
      .units {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <img class="hero" src="hero-art3.png" alt="Romantic Holiday for Steve and Grace to Tenerife" />

    <section class="countdown-panel" aria-label="Countdown to Tenerife Holiday">
      <p class="eyebrow">Countdown to Tenerife Holiday</p>
      <p class="trip-time">Trip date: 18 Sep 2026, 02:00 PM</p>
      <div class="units">
        <div class="unit">
          <span class="value" id="days">0</span>
          <span class="label">Days</span>
        </div>
        <div class="unit">
          <span class="value" id="hours">0</span>
          <span class="label">Hours</span>
        </div>
        <div class="unit">
          <span class="value" id="minutes">0</span>
          <span class="label">Minutes</span>
        </div>
      </div>
      <div class="footer-note">Champagne and cuddles in the hot tub under the stars ✨</div>
    </section>
  </main>

  <script>
    const targetDate = new Date('2026-09-18T14:00:00');

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '0';
        document.getElementById('hours').textContent = '0';
        document.getElementById('minutes').textContent = '0';
        return;
      }

      const totalMinutes = Math.floor(diff / (1000 * 60));
      const days = Math.floor(totalMinutes / (60 * 24));
      const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
      const minutes = totalMinutes % 60;

      document.getElementById('days').textContent = String(days);
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 30000);
  </script>
</body>
</html>
