<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tenerife Getaway with My Love</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --text: #ffffff;
      --muted: #f8d2dc;
      --gold: #ffe5b5;
      --panel-a: rgba(6, 14, 35, 0.60);
      --panel-b: rgba(11, 24, 56, 0.48);
      --hairline: rgba(255, 255, 255, 0.16);
      --sans: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: radial-gradient(circle at top, #143566 0%, #07142c 45%, #04101f 100%);
      color: var(--text);
      font-family: var(--sans);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .wrap { width: min(1535px, 100%); }

    /* The frame is the sizing context: everything inside the artwork scales with it. */
    .frame {
      position: relative;
      container-type: inline-size;
      aspect-ratio: 1535 / 1024;
      border-radius: 34px;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .hero {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Sits in the open sky above the sun: clears the subtitle, the polaroids,
       the palm fronds and the couple. */
    .countdown {
      position: absolute;
      left: 57%;
      top: 21.7%;
      width: 20.2%;
      background: linear-gradient(135deg, var(--panel-a), var(--panel-b));
      backdrop-filter: blur(10px) saturate(120%);
      -webkit-backdrop-filter: blur(10px) saturate(120%);
      border: 1px solid var(--hairline);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.30);
      padding: 8px 11px 9px;
      padding: 0.52cqw 0.70cqw 0.57cqw;
      text-align: center;
    }

    .countdown__head {
      margin: 0 0 8px;
      margin: 0 0 0.50cqw;
      font-size: 12px;
      font-size: 0.80cqw;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--muted);
      white-space: nowrap;
    }

    .units {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      gap: 0.39cqw;
    }

    .unit {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 9px;
      padding: 7px 3px 6px;
      padding: 0.45cqw 0.20cqw 0.40cqw;
    }

    .value {
      display: block;
      font-size: 27px;
      font-size: 1.75cqw;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 4px;
      margin-top: 0.25cqw;
      font-size: 9px;
      font-size: 0.58cqw;
      line-height: 1;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.80);
    }

    .caption {
      margin: 14px 0 0;
      text-align: center;
      font-size: clamp(0.85rem, 1.1vw, 1rem);
      font-weight: 600;
      color: var(--gold);
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      margin: -1px; padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* Arrived state */
    .countdown.is-here .units { display: none; }
    .countdown.is-here .countdown__head {
      margin: 0;
      color: var(--gold);
      font-size: 15px;
      font-size: 1.0cqw;
    }

    /* On phones the artwork is too small to host a legible overlay,
       so the countdown moves below it at a readable size. */
    @media (max-width: 620px) {
      body { padding: 10px; }
      .frame { border-radius: 18px; }
      .countdown {
        position: static;
        width: 100%;
        margin-top: 12px;
        border-radius: 16px;
        padding: 14px 14px 15px;
      }
      .countdown__head { font-size: 0.9rem; margin-bottom: 12px; white-space: normal; }
      .units { gap: 10px; }
      .unit { border-radius: 14px; padding: 12px 6px 10px; }
      .value { font-size: 2rem; }
      .label { font-size: 0.68rem; margin-top: 6px; }
      .countdown.is-here .countdown__head { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="frame">
      <img class="hero" src="hero-art3.png" width="1535" height="1024"
           alt="Illustration of Steve and Grace toasting with champagne at sunset in Tenerife, with a Jet2 flight map from Bristol and a photo of the ViVa Mora villa." />

      <section class="countdown" id="countdown" role="timer" aria-live="off">
        <p class="countdown__head" id="head">Counting down…</p>
        <div class="units">
          <div class="unit"><span class="value" id="days">–</span><span class="label">Days</span></div>
          <div class="unit"><span class="value" id="hours">–</span><span class="label">Hours</span></div>
          <div class="unit"><span class="value" id="minutes">–</span><span class="label">Minutes</span></div>
        </div>
      </section>
    </div>

    <p class="caption">Champagne and cuddles in the hot tub under the stars ✨</p>
    <p class="sr-only" id="announce" aria-live="polite"></p>
  </main>

  <script>
    // Single source of truth. +01:00 = UK summer time on 18 Sep 2026,
    // so the countdown is correct wherever it's opened from.
    const TRIP = new Date('2026-09-18T14:00:00+01:00');

    const el = {
      panel: document.getElementById('countdown'),
      head: document.getElementById('head'),
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      announce: document.getElementById('announce')
    };

    const tripLabel = new Intl.DateTimeFormat('en-GB', {
      day: 'numeric', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit', hour12: false,
      timeZone: 'Europe/London'
    }).format(TRIP);

    let lastAnnounced = '';

    function tick() {
      const diff = TRIP - new Date();

      if (diff <= 0) {
        el.panel.classList.add('is-here');
        el.head.textContent = 'Wheels up — enjoy every minute ✈️';
        return;
      }

      const totalMinutes = Math.floor(diff / 60000);
      const days = Math.floor(totalMinutes / 1440);
      const hours = Math.floor((totalMinutes % 1440) / 60);
      const minutes = totalMinutes % 60;

      el.head.textContent = 'Countdown · ' + tripLabel;
      el.days.textContent = days;
      el.hours.textContent = String(hours).padStart(2, '0');
      el.minutes.textContent = String(minutes).padStart(2, '0');

      const summary = days + ' days, ' + hours + ' hours and ' + minutes + ' minutes until Tenerife.';
      if (summary !== lastAnnounced) {
        lastAnnounced = summary;
        el.announce.textContent = summary;
      }
    }

    tick();
    setInterval(tick, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
  </script>
</body>
</html>
